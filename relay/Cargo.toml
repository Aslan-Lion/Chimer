[package]
name = "app-timer-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Optional online relay for app.timer (Milestone 7)."
license = "MIT"
publish = false

[[bin]]
name = "app-timer-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "json", "tokio"] }
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
